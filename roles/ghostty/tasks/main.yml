---
- name: ghostty | install via snap
  become: true
  community.general.snap:
    name: ghostty
    classic: "{{ ghostty_snap_classic }}"
    state: present

# The whole config directory is linked, so adding themes or a shader later is
# a commit rather than a playbook change.
- name: ghostty | link ~/.config/ghostty to the repo
  ansible.builtin.include_role:
    name: link
  vars:
    link_src: "{{ workstation_repo }}/dotfiles/ghostty"
    link_dest: "{{ workstation_home }}/.config/ghostty"
