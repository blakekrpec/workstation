---
# executable: /bin/bash is required — /bin/sh is dash on Ubuntu and has no
# `pipefail`. Both tasks below build in a temp file and install it only on
# success; the plain `> dest` version was worse than the keyring case, because
# the shell creates the redirect target *before* curl runs, so an failed fetch
# left an empty .list that `creates:` skipped forever.
#
# retries/delay are deliberately absent: Ansible ignores them without a matching
# `until:`, so the pair here was decoration rather than retry behaviour.
- name: nvidia-toolkit | download and install NVIDIA signing key
  become: true
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      curl -fsSL "{{ nvidia_keyring_url }}" | gpg --batch --yes --dearmor -o "$tmp"
      install -m 0644 "$tmp" "{{ nvidia_keyring_path }}"
    creates: "{{ nvidia_keyring_path }}"

- name: nvidia-toolkit | fetch and install nvidia-container-toolkit.list
  become: true
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      curl -fsSL "{{ nvidia_repo_list_url }}" \
        | sed 's#deb https://#deb [signed-by={{ nvidia_keyring_path }}] https://#' \
        > "$tmp"
      install -m 0644 "$tmp" /etc/apt/sources.list.d/nvidia-container-toolkit.list
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
  register: nvidia_repo_list

# Guarded on the repo definition actually changing, the same way
# roles/docker/tasks/main.yml guards its own cache update. An unconditional
# `update_cache: true` refreshes the cache on every converge, and the apt module
# reports that refresh as changed — so the run never settles at changed=0 even
# though nothing about the machine differs.
- name: nvidia-toolkit | update apt cache if the repo changed
  become: true
  when: nvidia_repo_list is changed
  ansible.builtin.apt:
    update_cache: true

- name: nvidia-toolkit | install nvidia-container-toolkit
  become: true
  ansible.builtin.apt:
    name: "nvidia-container-toolkit={{ nvidia_toolkit_version }}"
    state: present

- name: nvidia-toolkit | check if daemon.json already has nvidia runtime
  become: true
  ansible.builtin.slurp:
    path: /etc/docker/daemon.json
  register: daemon_json_slurp
  failed_when: false

- name: nvidia-toolkit | configure nvidia runtime if not present
  become: true
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=docker
  when: >
    daemon_json_slurp.content is not defined or
    'nvidia' not in (daemon_json_slurp.content | b64decode)
  notify: restart docker
