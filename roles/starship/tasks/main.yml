---
# Installs the starship binary at a pinned version and symlinks the config.
# The init is handled by dotfiles/bash/bashrc.d/40-starship.sh, which is picked
# up by the shell role's loader automatically.

- name: starship | read installed version
  ansible.builtin.command: starship --version
  register: starship_installed
  changed_when: false
  failed_when: false
  # Read-only, so run it even under --check. Without this the task is skipped,
  # stdout is empty, and the dry run always claims it will reinstall.
  check_mode: false

- name: starship | install {{ starship_version }}
  # Reinstalls when the pin is bumped, not just when starship is missing.
  when: starship_version not in (starship_installed.stdout | default(''))
  block:
    - name: starship | download {{ starship_version }} tarball
      ansible.builtin.get_url:
        url: "{{ starship_tarball_url }}"
        dest: "/tmp/starship-{{ starship_version }}-{{ starship_arch }}.tar.gz"
        mode: '0644'

    # The upstream tarball carries its CI builder's uid/gid (1001), which would
    # leave a non-root-owned binary on root's PATH. Force root ownership.
    - name: starship | extract to {{ starship_install_dir }}
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/starship-{{ starship_version }}-{{ starship_arch }}.tar.gz"
        dest: "{{ starship_install_dir }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: starship | clean up tarball
      ansible.builtin.file:
        path: "/tmp/starship-{{ starship_version }}-{{ starship_arch }}.tar.gz"
        state: absent

# Runs outside the install block. Machines provisioned before the unarchive
# gained owner/group still have the 1001:1001 binary on disk, and the block
# above only re-extracts on a pin bump — so without this the bad ownership
# would survive every converge until the next version bump.
- name: starship | stat the installed binary
  ansible.builtin.stat:
    path: "{{ starship_install_dir }}/starship"
  register: starship_binary

# Guarded on the stat so a --check run on a machine without starship skips this
# instead of failing against a binary the simulated install never wrote. A real
# first install needs no fixup — the unarchive above already lands it root-owned.
- name: starship | keep the binary root-owned
  when: starship_binary.stat.exists
  become: true
  ansible.builtin.file:
    path: "{{ starship_install_dir }}/starship"
    owner: root
    group: root
    mode: "0755"

- name: starship | verify the pinned version is what runs
  ansible.builtin.command: starship --version
  register: starship_check
  changed_when: false
  failed_when: starship_version not in starship_check.stdout

- name: starship | link ~/.config/starship.toml to the repo
  ansible.builtin.include_role:
    name: link
  vars:
    link_src: "{{ workstation_repo }}/dotfiles/starship/starship.toml"
    link_dest: "{{ workstation_home }}/.config/starship.toml"
