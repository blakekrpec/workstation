---
# GNOME settings are transplanted as raw `dconf dump` trees rather than
# hand-converted to YAML. To capture a tree from another machine:
#
#   dconf dump /org/gnome/shell/ > dotfiles/gnome/shell.ini
#
# commit it, and converge here. A path with no matching file is skipped, so
# this list can name trees before their files exist.
gnome_dconf_trees:
  - path: /org/gnome/shell/
    file: shell.ini
  # Scoped to interface/ on purpose — /org/gnome/desktop/ as a whole is NOT
  # safe to capture on this machine. That tree also carries [background] and
  # [screensaver] picture-uri, which variety rewrites to a fresh hash-named file
  # every rotation. Committing the parent would churn the repo constantly, and
  # each converge would dconf-load a stale path and reset the wallpaper out from
  # under variety. interface/ holds the theme and Yaru accent and nothing
  # volatile.
  - path: /org/gnome/desktop/interface/
    file: desktop-interface.ini
  - path: /org/gnome/settings-daemon/
    file: settings-daemon.ini
  - path: /org/gnome/mutter/
    file: mutter.ini
  - path: /org/gnome/shell/extensions/vitals/
    file: vitals.ini
  - path: /org/gnome/shell/extensions/multi-monitors-bar/
    file: multi-monitors-bar.ini

# Extensions available as apt packages. Anything from extensions.gnome.org
# that is not packaged should be installed via the Extension Manager GUI once,
# then captured in shell.ini (which carries enabled-extensions).
gnome_extension_packages:
  - gnome-shell-extension-manager

# Desktop apps that are not GNOME extensions and so cannot come from EGO.
# Variety is a wallpaper rotator; it ships in the Ubuntu archive (noble/universe).
gnome_apps:
  - variety

# Extensions to install from extensions.gnome.org. Each entry specifies the
# UUID and version. The version must match an available shell-version on EGO.
#
# To find the right version for a UUID on this machine's shell:
#   curl -sL "https://extensions.gnome.org/extension-info/?uuid=<UUID>&shell_version=$(gnome-shell --version | grep -oE '[0-9]+' | head -1)"
# and read `shell_version_map`. A version that does not list the running shell
# in its metadata.json is installed but silently never loaded.
gnome_extensions_from_ego:
  - uuid: Vitals@CoreCoding.com
    version: 80
  # "Multi Monitor Bar", a fork of spin83's Multi Monitors. shell.ini enables
  # this UUID, so without it here the extension is enabled-but-absent and the
  # shell just skips it.
  - uuid: multi-monitors-bar@frederykabryan
    version: 48
