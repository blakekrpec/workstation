---
# Applies GNOME settings from raw dconf dumps. See defaults/main.yml for how
# to capture a tree off another machine.

- name: gnome | install extension packages
  become: true
  ansible.builtin.apt:
    name: "{{ gnome_extension_packages }}"
    state: present
  when: gnome_extension_packages | length > 0

- name: gnome | install desktop apps
  become: true
  ansible.builtin.apt:
    name: "{{ gnome_apps }}"
    state: present
  when: gnome_apps | length > 0

- name: gnome | ensure extensions directory exists
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/share/gnome-shell/extensions"
    state: directory
    mode: '0755'

- name: gnome | check if EGO extensions are already installed
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/share/gnome-shell/extensions/{{ item.uuid }}"
  loop: "{{ gnome_extensions_from_ego }}"
  register: ego_extensions_stat
  when: gnome_extensions_from_ego | length > 0

- name: gnome | download extensions from extensions.gnome.org
  ansible.builtin.get_url:
    url: "https://extensions.gnome.org/extension-data/{{ item.item.uuid | replace('@', '') }}.v{{ item.item.version }}.shell-extension.zip"
    dest: "/tmp/{{ item.item.uuid }}.v{{ item.item.version }}.zip"
    mode: '0644'
  loop: "{{ ego_extensions_stat.results }}"
  when:
    - gnome_extensions_from_ego | length > 0
    - not item.stat.exists
  loop_control:
    label: "{{ item.item.uuid }}"

- name: gnome | install extensions via gnome-extensions
  ansible.builtin.command:
    cmd: "gnome-extensions install --force /tmp/{{ item.item.uuid }}.v{{ item.item.version }}.zip"
  loop: "{{ ego_extensions_stat.results }}"
  when:
    - gnome_extensions_from_ego | length > 0
    - not item.stat.exists
  loop_control:
    label: "{{ item.item.uuid }}"
  register: gnome_ego_install

# A running GNOME Shell scans the extension directories once, at startup. An
# extension dropped in afterwards is on disk and enabled in dconf but invisible
# to the session — `gnome-extensions list` will not even show it. Nothing in the
# playbook can fix that: reloading is disruptive, and on Wayland it is not
# possible at all without ending the session.
- name: gnome | queue the shell-restart notice
  when: gnome_ego_install is changed
  ansible.builtin.set_fact:
    workstation_notices: "{{ workstation_notices | default([]) + [gnome_notice] }}"
  vars:
    gnome_notice: "gnome: installed extension(s) that the running shell has not scanned yet. On X11 press Alt+F2, type r, press Enter. On Wayland log out and back in. Until then they will not appear, even in Extension Manager."

- name: gnome | clean up downloaded extension zips
  ansible.builtin.file:
    path: "/tmp/{{ item.uuid }}.v{{ item.version }}.zip"
    state: absent
  loop: "{{ gnome_extensions_from_ego }}"
  when: gnome_extensions_from_ego | length > 0

# `dconf load` always exits 0 and reports nothing, so a bare load would show as
# changed on every run. The obvious guard — diff the live dump against the file
# and load only when they differ — is wrong, and looped forever:
#
#   dconf load MERGES. It never removes a key that is absent from the file.
#
# So any key the desktop writes for itself that the dump does not carry (ding
# writing [extensions/ding] check-x11wayland after a session switch, for one)
# makes the two sides differ permanently. The load runs, cannot remove the extra
# key, and the next converge differs again — `changed` on every run, forever.
#
# Compare the dump before and after the load instead. That asks the question
# that actually matters — "did applying this file alter anything?" — and is
# immune to extra live keys, so these .ini files stay a curated subset rather
# than needing to track every key GNOME invents at runtime.
- name: gnome | apply dconf trees
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      f="{{ workstation_repo }}/dotfiles/gnome/{{ item.file }}"
      # A tree listed but not yet captured is simply skipped.
      [ -f "$f" ] || exit 0
      before="$(dconf dump "{{ item.path }}")"
      dconf load "{{ item.path }}" < "$f"
      after="$(dconf dump "{{ item.path }}")"
      if [ "$before" != "$after" ]; then
        echo WORKSTATION_CHANGED
      fi
  register: gnome_dconf
  changed_when: "'WORKSTATION_CHANGED' in gnome_dconf.stdout"
  loop: "{{ gnome_dconf_trees }}"
  loop_control:
    label: "{{ item.path }}"
