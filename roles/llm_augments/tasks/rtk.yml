---
# rtk — https://github.com/rtk-ai/rtk
# Wraps noisy dev commands (git status, cargo test, grep...) and strips the
# noise before it reaches the model. Installs to ~/.local/bin, which
# dotfiles/bash/bashrc.d/10-path.sh already puts on PATH.

- name: rtk | install
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
    creates: "{{ workstation_home }}/.local/bin/rtk"

# `rtk init -g` writes a PreToolUse hook + RTK.md into the Claude Code config.
# The CLAUDE.md in this repo imports RTK.md via @RTK.md. Guard on that import
# line already being present in the symlinked CLAUDE.md to prevent re-appending
# on a second machine where the committed file already carries the import.
- name: rtk | check if CLAUDE.md already has @RTK.md import
  ansible.builtin.shell:
    cmd: grep -qF '@RTK.md' "{{ workstation_home }}/.claude/CLAUDE.md"
  register: rtk_import_check
  failed_when: false
  changed_when: false
  when: rtk_install_hook

- name: rtk | install the Claude Code hook
  when: rtk_install_hook and rtk_import_check.rc != 0
  ansible.builtin.command:
    cmd: "{{ workstation_home }}/.local/bin/rtk init -g"
