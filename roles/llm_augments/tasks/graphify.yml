---
# graphify — https://github.com/Graphify-Labs/graphify
# Turns a repo (code, docs, PDFs, diagrams) into a queryable knowledge graph so
# the agent can answer structural questions without reading every file.
#
# PyPI package is `graphifyy` (double y); the command is `graphify`.
# Installed with pipx because Ubuntu 24.04 marks the system Python
# externally-managed (PEP 668) — plain `pip install --user` is refused.

- name: graphify | install pipx
  become: true
  ansible.builtin.apt:
    name: pipx
    state: present

- name: graphify | ensure pipx bin dir is on PATH for this run
  ansible.builtin.command: pipx ensurepath
  register: graphify_ensurepath
  changed_when: "'added to' in graphify_ensurepath.stdout | default('')"

- name: graphify | install graphifyy
  ansible.builtin.command:
    cmd: pipx install graphifyy
    creates: "{{ workstation_home }}/.local/bin/graphify"

# `graphify install` writes the /graphify skill into the Claude Code config.
# The CLAUDE.md in this repo imports graphify.md via @graphify.md (a namespaced
# file that gets overwritten, not appended). Guard on that import line already
# being present to prevent duplicate installs on a second machine.
- name: graphify | check if CLAUDE.md already has @graphify.md import
  ansible.builtin.shell:
    cmd: grep -qF '@graphify.md' "{{ workstation_home }}/.claude/CLAUDE.md"
  register: graphify_import_check
  failed_when: false
  changed_when: false
  when: graphify_register_skill

- name: graphify | register the /graphify skill
  when: graphify_register_skill and graphify_import_check.rc != 0
  ansible.builtin.command:
    cmd: "{{ workstation_home }}/.local/bin/graphify install"
  register: graphify_install_result
  changed_when: "'already installed' not in graphify_install_result.stdout"
