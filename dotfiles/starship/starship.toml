# Starship Configuration
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Use Rose Pine color palette
palette = "rosepine"

# Inserts a blank line between shell prompts
add_newline = true

# Rose Pine themed colors
format = """
[╭╴](muted)$all[╰─](muted)$character"""

# Timeout for starship to scan files (ms)
scan_timeout = 30
command_timeout = 500

[character]
success_symbol = "[❯](bold pine)"
error_symbol = "[❯](bold love)"
vimcmd_symbol = "[❮](bold pine)"

[directory]
style = "bold foam"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "love"

[git_branch]
symbol = " "
style = "bold iris"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold gold"
conflicted = "="
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = '[++\($count\)](green)'
renamed = "»"
deleted = "✘"

[nodejs]
symbol = " "
style = "bold pine"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold gold"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "bold love"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold foam"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold iris"
format = "via [$symbol$context]($style) "
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[package]
symbol = "󰏗 "
style = "bold rose"
format = "[$symbol$version]($style) "

[time]
disabled = false
time_format = "%R"
style = "bold subtle"
format = '[\[ $time \]]($style) '

# Rose Pine color palette
[palettes.rosepine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
